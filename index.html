<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulater</title>
    <script src="scriptTwo.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">
</head>


<body>
        <div class="kalkulater-container">
            <div id="display-output">
                <h2 id="output"></h3>
                <h1 id="input">0</h1>

            </div>

            
            <div id="buttons-container">

                <div id="button-nums">
                <button class="number" value="7">7</button>
                <button class="number" value="8">8</button>
                <button class="number" value="9">9</button>
                <button class="number" value="4">4</button>
                <button class="number" value="5">5</button>
                <button class="number" value="6">6</button>
                <button class="number" value="1">1</button>
                <button class="number" value="2">2</button>
                <button class="number" value="3">3</button>
                <button class="number" value="0" id="zero-button">0</button>
                <button class="number" value="." id="decimal">.</button>
                </div>

        
                <div id="button-operators">
                <button id="undo">Undo</button>
                <button id="clear">Clear</button>
                <button class="operator" id="divide" value="/">/</button>
                <button class="operator" id="multiply" value="*">*</button>
                <button class="operator" id="subtract" value="-">-</button>
                <button class="operator" id="add" value="+">+</button>
                <button id="equals-button">=</button>
                </div>

            </div>

            

        </div>

</body>


</html>
